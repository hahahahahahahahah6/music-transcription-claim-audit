[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-transcription-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
music-transcription-claim-audit = "music_transcription_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["music_transcription_claim_audit*"]
